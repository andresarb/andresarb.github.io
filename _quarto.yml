project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll

website:
  title: "Andrés Romero Bravo"
  favicon: images/favicon.png
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About me
      - href: research.qmd
        text: My research
      - href: cv.qmd
        text: CV
      - href: publications.qmd
        text: Publications
